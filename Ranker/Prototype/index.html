<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ranker</title>
    <link rel="icon" type="image/x-icon" href="/Ranker/Prototype/images/IconTrophy.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" style="background-color: #557fe941 !important;">
        <div class="container-fluid" style="color: #fff !important;">
            <a class="navbar-brand" href="index.html" style="font-weight: bolder;">Ranker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="documentation.html">Documentation</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="split-container">
        <div class="left">
    <!--SCOREBOARD-->
    <h2 class="Titles">Scoreboard</h2>
    <div class="table-wrapper">
        <button onclick="ScoreboardAdd()" class="btn"><i class="fa fa-plus-circle"></i></button>
        <button onclick="ScoreboardDelete()" class="btn"><i class="fa fa-trash"></i></button>
        <br>
        <input id="scoreBoardNameInput" class="scoreBoardInput"/>
        <input id="scoreBoardDescriptionInput" class="scoreBoardInput"/>
        <input type="number" id="scoreBoardSettingsIdInput" class="scoreBoardInput"/>
        <button onclick="scoreBoardEnter()" class="btn"><i class="fa fa-level-down"></i></button>
        <table class="fl-table" id="scoreBoardTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Settings ID</th>
                    <th>Unique Key</th>
                </tr>
            </thead>
            <tbody id="scoreBoardTableBody">
                
            <tbody>
        </table>
    </div>

        </div>
        <div class="right">

    <!--SCORE-->
    <h2 class="Titles">Score</h2>
    <div class="table-wrapper">
        <button onclick="ScoreAdd()" class="btn"><i class="fa fa-plus-circle"></i></button>
        <button onclick="ScoreDelete()" class="btn"><i class="fa fa-trash"></i></button>
        <input id="scoreParticipantNameInput" class="scoreBoardInput"/>
        <input id="scorePointsInput" type="number" class="scoreBoardInput"/>
        <button onclick="ScoreInsert()" class="btn"><i class="fa fa-level-down"></i></button>
        <table class="fl-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody id="scoreTableBody">
            <tbody>
        </table>
    </div>

        </div>
    </div>


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
